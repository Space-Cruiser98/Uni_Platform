<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="260" height="300" viewBox="0 0 260 300" fill="none">
  <!-- Diamond base -->
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#093B4C"/>
      <stop offset="1" stop-color="#1A6F9E"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#BEE3F8"/>
      <stop offset="1" stop-color="#7EB8DE"/>
    </linearGradient>
  </defs>

  <g transform="translate(130,150)">
    <!-- top dark triangle -->
    <path d="M0 -120 L92 0 L0 -40 L-92 0 Z" fill="url(#g1)" />
    <!-- lower light shape with waves -->
    <path d="M0 -40 L92 0 L0 120 L-92 0 Z" fill="url(#g2)" />

    <!-- wave accents -->
    <path d="M-60 20 C -20 10, 20 10, 60 20" stroke="#D7F0FB" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M-50 40 C -18 33, 18 33, 50 40" stroke="#C6E6F9" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- ENISO text -->
    <text x="0" y="-10" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="34" fill="#D7F0FB">ENISO</text>

  </g>
</svg>
